<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="150">
  <defs>
    <linearGradient id="worldzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0F1424"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .pulse-node {
      animation: nodePulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes nodePulse {
      0% { r: 3; opacity: 0.6; }
      100% { r: 5.5; opacity: 1; }
    }
    .signal-arc {
      stroke-dasharray: 8 16;
      animation: signalFlow 4s linear infinite;
    }
    @keyframes signalFlow {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    .globe-spin {
      transform-origin: 790px 75px;
      animation: rotateGlobe 30s linear infinite;
    }
    @keyframes rotateGlobe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .ring-pulse {
      animation: ringScale 4s ease-in-out infinite alternate;
      transform-origin: 790px 75px;
    }
    @keyframes ringScale {
      0% { transform: scale(0.96); opacity: 0.4; }
      100% { transform: scale(1.04); opacity: 0.8; }
    }
  </style>

  <!-- Container -->
  <rect width="900" height="150" rx="12" fill="url(#worldzBg)" stroke="#1E2738" stroke-width="1.5"/>

  <!-- Left Information & Metrics -->
  <g transform="translate(36, 40)">
    <text x="0" y="0" class="font-mono" font-size="11" fill="#38BDF8" letter-spacing="2">
      ✦ SECTION 03 // IMMERSIVE 3D
    </text>
    <text x="0" y="26" class="font-sans" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="3">
      🌍 GLOBAL CREATIVE NETWORK LIVE
    </text>
    <text x="0" y="52" class="font-mono" font-size="12" fill="#94A3B8" letter-spacing="1">
      20 Global Hubs • Real-time Day/Night Solar Terminator • Great-Circle Routing
    </text>
    <g transform="translate(0, 74)">
      <rect width="130" height="24" rx="12" fill="#132338" stroke="#0284C7" stroke-width="0.75"/>
      <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
      <text x="24" y="15.5" class="font-mono" font-size="9.5" font-weight="600" fill="#BAE6FD" letter-spacing="1">THREE.JS / WEBGL</text>

      <rect x="140" y="0" width="136" height="24" rx="12" fill="#181926" stroke="#4F46E5" stroke-width="0.75"/>
      <circle cx="152" cy="12" r="3.5" fill="#818CF8"/>
      <text x="164" y="15.5" class="font-mono" font-size="9.5" font-weight="600" fill="#C7D2FE" letter-spacing="1">0% CPU OFFSCREEN</text>

      <rect x="286" y="0" width="146" height="24" rx="12" fill="#1C1427" stroke="#9333EA" stroke-width="0.75"/>
      <circle cx="298" cy="12" r="3.5" fill="#C084FC"/>
      <text x="310" y="15.5" class="font-mono" font-size="9.5" font-weight="600" fill="#E9D5FF" letter-spacing="1">HARD MOBILE SAFETY</text>
    </g>
  </g>

  <!-- Right Stylized Planetary Sphere Visualization -->
  <g id="globeGroup">
    <!-- Outer Orbit Ring -->
    <ellipse cx="780" cy="75" rx="55" ry="55" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" class="ring-pulse"/>
    <!-- Globe Body -->
    <circle cx="780" cy="75" r="44" fill="#0C1222" stroke="url(#globeGrad)" stroke-width="1.5"/>

    <!-- Latitude / Longitude Ellipses -->
    <ellipse cx="780" cy="75" rx="44" ry="18" fill="none" stroke="#1E293B" stroke-width="1"/>
    <ellipse cx="780" cy="75" rx="44" ry="34" fill="none" stroke="#1E293B" stroke-width="1"/>
    <ellipse cx="780" cy="75" rx="20" ry="44" fill="none" stroke="#1E293B" stroke-width="1"/>
    <ellipse cx="780" cy="75" rx="35" ry="44" fill="none" stroke="#1E293B" stroke-width="1"/>
    <line x1="780" y1="31" x2="780" y2="119" stroke="#334155" stroke-width="1"/>
    <line x1="736" y1="75" x2="824" y2="75" stroke="#334155" stroke-width="1"/>

    <!-- Signal Arcs between hubs -->
    <path d="M 762 58 Q 780 40 802 65" fill="none" stroke="#00F2FE" stroke-width="1.5" class="signal-arc"/>
    <path d="M 762 58 Q 770 90 790 92" fill="none" stroke="#FF3366" stroke-width="1.5" class="signal-arc"/>

    <!-- Hub Nodes -->
    <circle cx="762" cy="58" r="4" fill="#00F2FE" class="pulse-node"/>
    <circle cx="802" cy="65" r="3.5" fill="#38BDF8" class="pulse-node"/>
    <circle cx="790" cy="92" r="3.5" fill="#FF3366" class="pulse-node"/>
    <circle cx="755" cy="85" r="3" fill="#10B981" class="pulse-node"/>
  </g>
</svg>
