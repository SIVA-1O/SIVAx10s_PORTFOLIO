<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="100%" height="96">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="50%" stop-color="#141B2A"/>
      <stop offset="100%" stop-color="#0A0D15"/>
    </linearGradient>

    <linearGradient id="ctaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.01); filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4)); }
    }
    .arrow-nudge {
      animation: arrowNudge 1.5s ease-in-out infinite alternate;
    }
    @keyframes arrowNudge {
      0% { transform: translateX(0); }
      100% { transform: translateX(5px); }
    }
  </style>

  <!-- Container -->
  <rect width="900" height="96" rx="12" fill="url(#ctaBg)" stroke="url(#ctaBorder)" stroke-width="1.5"/>

  <!-- Left Tech Accent -->
  <g transform="translate(30, 48)">
    <text x="0" y="-8" class="font-mono" font-size="9" fill="#64748B" letter-spacing="2">SYSTEM</text>
    <text x="0" y="8" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">CLOUDFLARE ✦</text>
    <text x="0" y="22" class="font-mono" font-size="9" fill="#64748B" letter-spacing="1">STATIC WORKER</text>
  </g>

  <!-- Center Prominent CTA -->
  <g id="centerCta" class="pulse-glow">
    <text x="450" y="44" text-anchor="middle" class="font-sans" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="4">
      🚀 ✦ ENTER THE PORTFOLIO ✦ 🚀
    </text>
    <text x="450" y="70" text-anchor="middle" class="font-mono" font-size="12.5" font-weight="600" fill="#00F2FE" letter-spacing="1.5">
      https://sivax10s-portfoli0.sivasuriyamvsn.workers.dev
    </text>
  </g>

  <!-- Right Launch Arrow Button -->
  <g transform="translate(800, 48)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <g class="arrow-nudge">
      <text x="-16" y="6" class="font-mono" font-size="16" font-weight="700" fill="#00F2FE">LAUNCH ↗</text>
    </g>
  </g>
</svg>
