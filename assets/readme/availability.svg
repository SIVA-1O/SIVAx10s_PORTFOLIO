<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="70">
  <defs>
    <linearGradient id="availBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09140F"/>
      <stop offset="50%" stop-color="#0E1E17"/>
      <stop offset="100%" stop-color="#060D0A"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .radar-ping {
      animation: radarPing 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: 45px 35px;
    }
    @keyframes radarPing {
      0% { r: 5; opacity: 0.9; }
      75%, 100% { r: 16; opacity: 0; }
    }
    .dot-core {
      animation: dotGlow 2.4s ease-in-out infinite;
    }
    @keyframes dotGlow {
      0%, 100% { fill: #10B981; }
      50% { fill: #34D399; }
    }
  </style>

  <!-- Box -->
  <rect width="900" height="70" rx="10" fill="url(#availBg)" stroke="#164E37" stroke-width="1.2"/>

  <!-- Radar Beacon -->
  <circle cx="45" cy="35" r="12" fill="none" stroke="#10B981" stroke-width="1" class="radar-ping"/>
  <circle cx="45" cy="35" r="6" fill="#10B981" class="dot-core"/>

  <!-- Text Information -->
  <text x="75" y="32" class="font-sans" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    AVAILABLE FOR SELECT COMMISSIONS
  </text>
  <text x="75" y="52" class="font-mono" font-size="11" fill="#6EE7B7" letter-spacing="1">
    Brand Identity • Visual Systems • Digital &amp; Spatial Experiences • Global Remote
  </text>

  <!-- Right Pill -->
  <g transform="translate(735, 23)">
    <rect width="135" height="24" rx="12" fill="#06281B" stroke="#059669" stroke-width="1"/>
    <text x="67.5" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#34D399" letter-spacing="1">
      BOOKING 2026
    </text>
  </g>
</svg>
