<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="50%" stop-color="#0D0E14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#00F2FE"/>
      <stop offset="70%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="accentBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .pulse-dot {
      animation: pulseGreen 2.5s ease-in-out infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .beam-anim {
      animation: beamSlide 6s linear infinite;
    }
    @keyframes beamSlide {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    .cycle-item {
      opacity: 0;
      animation: textCycle 20s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: center center;
    }
    .c1  { animation-delay: 0s; }
    .c2  { animation-delay: 2s; }
    .c3  { animation-delay: 4s; }
    .c4  { animation-delay: 6s; }
    .c5  { animation-delay: 8s; }
    .c6  { animation-delay: 10s; }
    .c7  { animation-delay: 12s; }
    .c8  { animation-delay: 14s; }
    .c9  { animation-delay: 16s; }
    .c10 { animation-delay: 18s; }

    @keyframes textCycle {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      1.5%, 8.5% {
        opacity: 1;
        transform: translateY(0);
      }
      10%, 100% {
        opacity: 0;
        transform: translateY(-16px);
      }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #FFFFFF 0%, #00F2FE 50%, #FFFFFF 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      to { background-position: 200% center; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" stroke="#1E222D" stroke-width="1.5"/>
  <rect width="900" height="240" rx="12" fill="url(#grid)"/>

  <!-- Editorial Corner Marks -->
  <path d="M 18 28 L 18 18 L 28 18" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 882 28 L 882 18 L 872 18" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 18 212 L 18 222 L 28 222" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 882 212 L 882 222 L 872 222" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Metadata Bar -->
  <text x="35" y="44" class="font-mono" font-size="11" fill="#717686" letter-spacing="2">
    ✦ SIVASURIYA // PORTFOLIO 2026
  </text>
  <text x="450" y="44" class="font-mono" font-size="10" fill="#4FACFE" text-anchor="middle" letter-spacing="3" opacity="0.8">
    EDITORIAL • DIGITAL • 3D EXPERIENCES
  </text>

  <!-- Status indicator -->
  <g transform="translate(805, 41)">
    <circle cx="0" cy="0" r="4.5" fill="#10B981" class="pulse-dot"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4"/>
    <text x="14" y="3.5" class="font-mono" font-size="10" fill="#10B981" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- Divider line -->
  <line x1="35" y1="58" x2="865" y2="58" stroke="#1F232D" stroke-width="1"/>

  <!-- Animated Center Title (10 Cycling Roles/Disciplines) -->
  <g id="cycleGroup">
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c1" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="6">
      SIVASURIYA
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c2" font-size="24" font-weight="700" fill="#00F2FE" letter-spacing="3">
      MULTIDISCIPLINARY GRAPHIC DESIGNER
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c3" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="4">
      VISUAL DESIGNER
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c4" font-size="32" font-weight="800" fill="#FF3366" letter-spacing="6">
      BRANDING
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c5" font-size="30" font-weight="800" fill="#00F2FE" letter-spacing="5">
      GRAPHIC DESIGN
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c6" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="5">
      DIGITAL DESIGN
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c7" font-size="32" font-weight="800" fill="#4FACFE" letter-spacing="6">
      UI / UX
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c8" font-size="32" font-weight="800" fill="#F5A623" letter-spacing="6">
      MOTION
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c9" font-size="34" font-weight="800" fill="#00F2FE" letter-spacing="7">
      3D
    </text>
    <text x="450" y="128" text-anchor="middle" class="font-sans cycle-item c10" font-size="28" font-weight="800" fill="#FF3366" letter-spacing="4">
      EXPERIMENTAL MEDIA
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="450" y="165" text-anchor="middle" class="font-mono" font-size="12" fill="#8B92A5" letter-spacing="3">
    VISUAL SYSTEMS  •  BRAND IDENTITIES  •  DIGITAL EXPERIENCES  •  WEBGL
  </text>

  <!-- Bottom Accent Light Beam -->
  <line x1="35" y1="195" x2="865" y2="195" stroke="#161922" stroke-width="1"/>
  <rect x="0" y="194.5" width="220" height="2" fill="url(#accentBeam)" class="beam-anim"/>

  <!-- Bottom Meta Tags -->
  <text x="35" y="218" class="font-mono" font-size="10" fill="#4E5364" letter-spacing="2">
    INDEX 01 / 08
  </text>
  <text x="450" y="218" text-anchor="middle" class="font-mono" font-size="10" fill="#00F2FE" letter-spacing="3" opacity="0.9">
    ✦ CONTINUOUS CURATION ✦
  </text>
  <text x="865" y="218" text-anchor="end" class="font-mono" font-size="10" fill="#4E5364" letter-spacing="2">
    CHENNAI, IN [ UTC+5:30 ]
  </text>
</svg>
