<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .star-pulse {
      animation: starRotate 8s ease-in-out infinite;
      transform-origin: 450px 12px;
    }
    @keyframes starRotate {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 4px #00F2FE); }
    }
    .pulse-scan {
      animation: pulseScan 6s ease-in-out infinite;
    }
    @keyframes pulseScan {
      0% { transform: translateX(-400px); }
      50% { transform: translateX(400px); }
      100% { transform: translateX(-400px); }
    }
  </style>

  <!-- Base Line -->
  <line x1="30" y1="12" x2="430" y2="12" stroke="#1F2430" stroke-width="1"/>
  <line x1="470" y1="12" x2="870" y2="12" stroke="#1F2430" stroke-width="1"/>

  <!-- Scanning Light Beam -->
  <g clip-path="url(#lineClip)">
    <rect x="250" y="11" width="150" height="2" fill="url(#dividerPulse)" class="pulse-scan"/>
  </g>

  <!-- Center Diamond Star -->
  <g class="star-pulse">
    <polygon points="450,5 453.5,12 460,12 454.5,15.5 456.5,22 450,17.5 443.5,22 445.5,15.5 440,12 446.5,12" fill="#00F2FE"/>
  </g>

  <!-- Outer Dots -->
  <circle cx="30" cy="12" r="1.5" fill="#334155"/>
  <circle cx="870" cy="12" r="1.5" fill="#334155"/>
</svg>
