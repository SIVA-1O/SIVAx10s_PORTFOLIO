<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="70">
  <defs>
    <linearGradient id="gitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0B0D13"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .pulse-star {
      animation: pulseStar 3s ease-in-out infinite;
    }
    @keyframes pulseStar {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; transform: scale(1.1); transform-origin: 825px 35px; }
    }
  </style>

  <!-- Container -->
  <rect width="900" height="70" rx="10" fill="url(#gitBg)" stroke="#30363D" stroke-width="1.2"/>

  <!-- GitHub Mark -->
  <g transform="translate(30, 23)">
    <circle cx="12" cy="12" r="14" fill="#21262D"/>
    <!-- Octocat silhouette -->
    <path d="M12 4C7.58 4 4 7.58 4 12c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 20 12c0-4.42-3.58-8-8-8z" fill="#F0F6FC"/>
  </g>

  <!-- Repo Title & Info -->
  <text x="75" y="32" class="font-mono" font-size="14" font-weight="700" fill="#58A6FF" letter-spacing="1">
    SIVA-1O / SIVAx10s_PORTFOLIO
  </text>
  <text x="75" y="52" class="font-mono" font-size="11" fill="#8B949E" letter-spacing="0.5">
    Clean Architecture • Zero Build Pipeline • Direct Cloudflare &amp; GitHub Pages Static Deployment
  </text>

  <!-- Right Pill -->
  <g transform="translate(735, 23)">
    <rect width="135" height="24" rx="12" fill="#21262D" stroke="#388BFD" stroke-width="0.75"/>
    <text x="67.5" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#58A6FF" letter-spacing="1">
      MAIN BRANCH ✦
    </text>
  </g>
</svg>
