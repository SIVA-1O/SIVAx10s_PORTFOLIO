<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;display=swap');
      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      
      .orbit-slow {
        transform-origin: 750px 100px;
        animation: orbitRotate 45s linear infinite;
      }
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .orbit-counter {
        transform-origin: 750px 100px;
        animation: orbitCounter 60s linear infinite;
      }
      @keyframes orbitCounter {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }

      .pulse-beacon {
        animation: beaconGlow 3s ease-in-out infinite alternate;
      }
      @keyframes beaconGlow {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Exhibition Card Background -->
  <rect width="900" height="200" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1"/>

  <!-- Left: Scientific Exhibition Typography -->
  <g transform="translate(36, 36)">
    <text x="0" y="0" class="font-mono" font-size="9.5" font-weight="500" fill="#666666" letter-spacing="3">
      INSTALLATION // 03
    </text>
    <text x="0" y="32" class="font-sans" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      WORLDZ
    </text>
    <text x="0" y="58" class="font-mono" font-size="11" font-weight="600" fill="#CCCCCC" letter-spacing="2">
      GLOBAL CREATIVE NETWORK • LIVE DAY / NIGHT
    </text>
    <text x="0" y="80" class="font-mono" font-size="9.5" font-weight="400" fill="#777777" letter-spacing="1.5">
      20 COUNTRIES  •  REAL-TIME SOLAR TERMINATOR  •  SPATIAL 3D
    </text>

    <!-- Technical Specification Pill -->
    <g transform="translate(0, 105)">
      <rect width="400" height="26" fill="#111111" stroke="#222222" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#E5E5E5" class="pulse-beacon"/>
      <text x="26" y="17" class="font-mono" font-size="8.5" font-weight="500" fill="#999999" letter-spacing="1.5">
        TELEMETRY: UTC SOLAR DECLINATION • 0% CPU OFFSCREEN
      </text>
    </g>
  </g>

  <!-- Right: Minimal Astronomical Wireframe Sphere -->
  <g id="globe">
    <!-- Outer dashed boundary ring -->
    <circle cx="750" cy="100" r="70" fill="none" stroke="#222222" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Counter-rotating orbit ring with measurement ticks -->
    <g class="orbit-counter">
      <ellipse cx="750" cy="100" rx="64" ry="24" fill="none" stroke="#333333" stroke-width="1"/>
      <circle cx="814" cy="100" r="2" fill="#888888"/>
      <circle cx="686" cy="100" r="2" fill="#888888"/>
    </g>

    <!-- Slow rotating planetary axes -->
    <g class="orbit-slow">
      <ellipse cx="750" cy="100" rx="28" ry="58" fill="none" stroke="#444444" stroke-width="1"/>
      <ellipse cx="750" cy="100" rx="58" ry="28" fill="none" stroke="#2A2A2A" stroke-width="1"/>
      <circle cx="750" cy="42" r="2.5" fill="#FFFFFF"/>
      <circle cx="750" cy="158" r="2" fill="#777777"/>
    </g>

    <!-- Inner sphere outline -->
    <circle cx="750" cy="100" r="58" fill="#0A0A0A" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Solar terminator line (diagonal slice) -->
    <line x1="720" y1="50" x2="780" y2="150" stroke="#555555" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Center Coordinate Marker -->
    <line x1="740" y1="100" x2="760" y2="100" stroke="#888888" stroke-width="0.75"/>
    <line x1="750" y1="90" x2="750" y2="110" stroke="#888888" stroke-width="0.75"/>
    <circle cx="750" cy="100" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
