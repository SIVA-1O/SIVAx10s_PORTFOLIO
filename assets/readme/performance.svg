<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60">
  <defs>
    <linearGradient id="perfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C12"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .badge-pulse {
      animation: badgeGlow 4s ease-in-out infinite alternate;
    }
    @keyframes badgeGlow {
      0% { opacity: 0.85; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3)); }
    }
  </style>

  <!-- Box -->
  <rect width="900" height="60" rx="10" fill="url(#perfBg)" stroke="#1A202C" stroke-width="1"/>

  <!-- 6 Badges -->
  <g transform="translate(18, 14)" class="badge-pulse">
    <!-- 1 -->
    <rect x="0" y="0" width="134" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="67" y="20" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8">🚀 FAST</text>

    <!-- 2 -->
    <rect x="146" y="0" width="134" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="213" y="20" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#34D399">🖼️ OPTIMIZED</text>

    <!-- 3 -->
    <rect x="292" y="0" width="138" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="361" y="20" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#F472B6">🎥 COMPRESSED</text>

    <!-- 4 -->
    <rect x="442" y="0" width="138" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="511" y="20" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#A78BFA">🧊 LAZY LOADED</text>

    <!-- 5 -->
    <rect x="592" y="0" width="134" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="659" y="20" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#FBBF24">📱 RESPONSIVE</text>

    <!-- 6 -->
    <rect x="738" y="0" width="126" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="801" y="20" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#2DD4BF">⚡ LIGHTWEIGHT</text>
  </g>
</svg>
